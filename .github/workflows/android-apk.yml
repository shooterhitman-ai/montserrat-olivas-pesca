name: Compilar APK Android - Lunisolar Darksec

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Calendario_Pesca_Lunisolar_Darksec_Organizado_v1_9_1.zip'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Lunisolar Darksec v1.9.1
        run: |
          test -f 'Calendario_Pesca_Lunisolar_Darksec_Organizado_v1_9_1.zip' || { echo "Falta subir el ZIP v1.9.1 al repositorio"; exit 1; }
          unzip -o 'Calendario_Pesca_Lunisolar_Darksec_Organizado_v1_9_1.zip'
          cp -a MontserratOlivas_AndroidStudio/. .
          echo "Comprobando version y funciones 1.9.1"
          grep -Fq "versionName '1.9.1'" app/build.gradle
          grep -Fq '<strong>1.9.1</strong>' app/src/main/assets/index.html
          grep -Fq 'id="prefWidgetFont"' app/src/main/assets/index.html
          grep -Fq 'openDarksecNotification' app/src/main/assets/index.html
          grep -Fq 'class="dashboard-stack stack-luna"' app/src/main/assets/index.html
          grep -Fq 'class="dashboard-stack stack-clima"' app/src/main/assets/index.html
          test -s app/src/main/java/com/montserratolivas/pesca/PotentialWidget.java
          test -s app/src/main/res/layout/potential_widget.xml
          test -s app/src/main/res/xml/potential_widget_info.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lunisolar-Darksec-APK-v1.9.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
