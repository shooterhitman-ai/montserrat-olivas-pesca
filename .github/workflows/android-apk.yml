name: Compilar APK Android - Lunisolar Darksec

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Calendario_Pesca_Lunisolar_Darksec_v1_10_8.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Lunisolar Darksec v1.10.8
        run: |
          archive='Calendario_Pesca_Lunisolar_Darksec_v1_10_8.zip'
          test -f "$archive" || { echo "Falta subir el ZIP v1.10.8 a la raíz del repositorio"; exit 1; }
          unzip -q -o "$archive" -d extracted-project
          project='extracted-project/Calendario_Pesca_Lunisolar_Darksec_v1_10_8'
          test -f "$project/app/build.gradle" || { echo "El ZIP no contiene el proyecto v1.10.8 esperado"; exit 1; }
          cp -a "$project"/. .
          echo "Comprobando versión y funciones 1.10.8"
          grep -Fq "versionCode 22" app/build.gradle
          grep -Fq "versionName '1.10.8'" app/build.gradle
          grep -Fq '<strong>1.10.8</strong>' app/src/main/assets/index.html
          grep -Fq 'forecastSelectedSummary' app/src/main/assets/index.html
          grep -Fq 'Ajusta la letra del widget principal (85–120 %)' app/src/main/assets/index.html
          grep -Fq '{R.id.widget_temp, 13},{R.id.widget_rain, 13},{R.id.widget_wind, 13}' app/src/main/java/com/montserratolivas/pesca/MoonWidget.java
          grep -Fq 'max="120"' app/src/main/assets/index.html
          grep -Fq 'Riesgo meteorológico' app/src/main/assets/index.html
          grep -Fq 'hourVisualStatus' app/src/main/assets/index.html
          grep -Fq 'selectForecastTimestamp' app/src/main/assets/index.html
          grep -Fq 'darksecCurrentTimeMarker' app/src/main/assets/index.html
          test -s app/src/main/assets/current_time_marker.js
          test -s app/src/main/java/com/montserratolivas/pesca/PotentialWidget.java
          test -s app/src/main/res/layout/potential_widget.xml
          test -s app/src/main/res/xml/potential_widget_info.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar ventana del widget al cruzar medianoche
        run: |
          mkdir -p build/widget-check
          javac -encoding UTF-8 -d build/widget-check app/src/main/java/com/montserratolivas/pesca/PotentialWindow.java tests/PotentialWindowCheck.java
          java -cp build/widget-check PotentialWindowCheck
      - name: Preparar SDK Android
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar búsqueda y comandos de voz
        run: |
          node tests/search-check.cjs
          node tests/wiki-voice-check.cjs
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lunisolar-Darksec-APK-v1.10.8
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

