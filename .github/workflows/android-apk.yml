name: Compilar APK Android - Lunisolar Darksec

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Calendario_Pesca_Lunisolar_Darksec_GPS_Luna_Widget_v1_8_0.zip'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Lunisolar Darksec v1.8
        run: |
          test -f Calendario_Pesca_Lunisolar_Darksec_GPS_Luna_Widget_v1_8_0.zip || { echo "Falta subir el ZIP v1.8.0 al repositorio"; exit 1; }
          unzip -o Calendario_Pesca_Lunisolar_Darksec_GPS_Luna_Widget_v1_8_0.zip
          cp -a MontserratOlivas_AndroidStudio/. .
          echo "Verificando la versión 1.8.0 y las nuevas funciones"
          grep -Fq "versionName '1.8.0'" app/build.gradle
          grep -Fq '<strong>1.8.0</strong>' app/src/main/assets/index.html
          grep -Fq 'id="moonRise"' app/src/main/assets/index.html
          grep -Fq 'id="moonSet"' app/src/main/assets/index.html
          grep -Fq 'autoGpsOnOpen' app/src/main/assets/index.html
          grep -Fq 'widget_risk_detail' app/src/main/res/layout/moon_widget.xml
          test -s app/src/main/assets/moon_times.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lunisolar-Darksec-APK-v1.8.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
