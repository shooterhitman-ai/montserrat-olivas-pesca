name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Android
        run: |
          if [ -f MontserratOlivas_Android_Configuracion_Widget_Mapa_v1_6_0.zip ]; then
            echo "Compilando Montserrat Olivas 1.6.0: widget compacto, unidades, mapa y formatos"
            unzip -o MontserratOlivas_Android_Configuracion_Widget_Mapa_v1_6_0.zip
            BUILD_VERSION="1.6.0"
          elif [ -f MontserratOlivas_Android_Widget_Clima_Corregido_v1_5_1.zip ]; then
            echo "Compilando versión 1.5.1: widget compatible, datos horarios alineados"
            unzip -o MontserratOlivas_Android_Widget_Clima_Corregido_v1_5_1.zip
            BUILD_VERSION="1.5.1"
          elif [ -f MontserratOlivas_Android_Clima_Widget_v1_5_0.zip ]; then
            echo "Compilando versión 1.5.0: widget, clima y ajustes auditados"
            unzip -o MontserratOlivas_Android_Clima_Widget_v1_5_0.zip
            BUILD_VERSION="1.5.0"
          elif [ -f MontserratOlivas_Android_Clima_Widget_Pro_v1_4.zip ]; then
            unzip -o MontserratOlivas_Android_Clima_Widget_Pro_v1_4.zip
            BUILD_VERSION="1.4.0"
          elif [ -f "MontserratOlivas_Android_Clima_Widget_Pro_v1_4 (1).zip" ]; then
            unzip -o "MontserratOlivas_Android_Clima_Widget_Pro_v1_4 (1).zip"
            BUILD_VERSION="1.4.0"
          else
            echo "ERROR: No se encontró ZIP del proyecto Android"
            exit 1
          fi
          cp -a MontserratOlivas_AndroidStudio/. .
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "Verificando versión $BUILD_VERSION"
          grep -Fq "versionName '$BUILD_VERSION'" app/build.gradle
          grep -Fq "<strong>$BUILD_VERSION</strong>" app/src/main/assets/index.html
          echo "Verificación de versión superada"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Montserrat-Olivas-APK-v${{ env.BUILD_VERSION }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
