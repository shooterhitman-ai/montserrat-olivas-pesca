name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Android
        run: |
          if [ -f MontserratOlivas_Proyecto_Android_Widget_Notificaciones.zip ]; then
            unzip -o MontserratOlivas_Proyecto_Android_Widget_Notificaciones.zip
          else
            unzip -o MontserratOlivas_Proyecto_Android_Personalizado.zip
          fi
          cp -a MontserratOlivas_AndroidStudio/. .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Montserrat-Olivas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
