name: Compilar APK Android - Lunisolar Darksec

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Calendario_Pesca_Lunisolar_Darksec_v1_10_0.zip'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Lunisolar Darksec v1.10.0
        run: |
          archive='Calendario_Pesca_Lunisolar_Darksec_v1_10_0.zip'
          test -f "$archive" || { echo "Falta subir el ZIP v1.10.0 al repositorio"; exit 1; }
          unzip -q -o "$archive" -d extracted-project
          project='extracted-project/Calendario_Pesca_Lunisolar_Darksec_v1_10_0'
          test -f "$project/app/build.gradle" || { echo "El ZIP no contiene el proyecto v1.10.0 esperado"; exit 1; }
          cp -a "$project"/. .
          echo "Comprobando versión y funciones 1.10.0"
          grep -Fq "versionName '1.10.0'" app/build.gradle
          grep -Fq '<strong>1.10.0</strong>' app/src/main/assets/index.html
          grep -Fq 'id="prefWidgetFont"' app/src/main/assets/index.html
          grep -Fq 'openDarksecNotification' app/src/main/assets/index.html
          grep -Fq 'class="dashboard-stack stack-luna"' app/src/main/assets/index.html
          grep -Fq 'class="dashboard-stack stack-clima"' app/src/main/assets/index.html
          grep -Fq 'id="mapSearchQuery"' app/src/main/assets/index.html
          grep -Fq 'id="mapSearchVoice"' app/src/main/assets/index.html
          grep -Fq 'id="favoriteList"' app/src/main/assets/index.html
          grep -Fq 'id="feelsKpi"' app/src/main/assets/index.html
          grep -Fq 'id="humidityKpi"' app/src/main/assets/index.html
          grep -Fq 'id="precipKpi"' app/src/main/assets/index.html
          grep -Fq 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/location_search.js
          test -s app/src/main/java/com/montserratolivas/pesca/PotentialWidget.java
          test -s app/src/main/res/layout/potential_widget.xml
          test -s app/src/main/res/xml/potential_widget_info.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lunisolar-Darksec-APK-v1.10.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
